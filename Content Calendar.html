<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Content Calendar</title>
<style>
:root{--bg:#f7f7f5;--sf:#fff;--tx:#1d2428;--mu:#6d777d;--ln:#e3e5e3;--ac:#0f766e;
--edu:#2563eb;--hib:#d97706;--pro:#15803d;--eduB:#e8f0fe;--hibB:#fdf1dc;--proB:#e3f4e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181a;--sf:#1c2124;--tx:#e8ecee;--mu:#8e999f;--ln:#2d3438;--ac:#2dd4bf;
--edu:#7aa7ff;--hib:#f5b450;--pro:#5fd08a;--eduB:#1d2a44;--hibB:#3a2c12;--proB:#173523}}
:root[data-theme="dark"]{--bg:#14181a;--sf:#1c2124;--tx:#e8ecee;--mu:#8e999f;--ln:#2d3438;--ac:#2dd4bf;--edu:#7aa7ff;--hib:#f5b450;--pro:#5fd08a;--eduB:#1d2a44;--hibB:#3a2c12;--proB:#173523}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:650}
.nav{display:flex;gap:6px;align-items:center}
.nav b{min-width:140px;text-align:center;font-size:16px;font-weight:600}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0b1b19}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0b1b19}}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.f{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:3px 11px;cursor:pointer;font-size:13px;display:flex;gap:6px;align-items:center}
.f i{width:8px;height:8px;border-radius:50%;display:inline-block}
.f[aria-pressed=true]{border-color:var(--ac);font-weight:600}
.cal{background:var(--sf);border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:8px;font-size:12px;color:var(--mu);border-bottom:1px solid var(--ln);text-align:left}
.day{min-height:104px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.day:nth-child(7n){border-right:0}
.day:hover{background:color-mix(in srgb,var(--ac) 5%,transparent)}
.day.out{opacity:.45}
.day .n{font-size:12px;color:var(--mu);width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.day.today .n{background:var(--ac);color:#fff;font-weight:600}
.chip{all:unset;box-sizing:border-box;display:block;width:100%;font-size:11.5px;line-height:1.3;padding:2px 6px;border-radius:4px;border-left:3px solid;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.Edukasi{background:var(--eduB);border-color:var(--edu)}
.chip.Hiburan{background:var(--hibB);border-color:var(--hib)}
.chip.Promosi{background:var(--proB);border-color:var(--pro)}
.chip.x{background:var(--bg);border-color:var(--mu)}
.more{font-size:11px;color:var(--mu);padding-left:4px}
.un{margin-top:18px}
.un h2{font-size:14px;margin:0 0 8px;font-weight:600}
.row{display:flex;gap:10px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;margin-bottom:6px;cursor:pointer}
.row small{color:var(--mu)}
.tag{font-size:11px;border:1px solid var(--ln);border-radius:99px;padding:1px 8px;color:var(--mu);white-space:nowrap}
.tag.ACC{color:var(--pro);border-color:var(--pro)}
dialog{border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);padding:0;width:min(560px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.4)}
form{padding:16px;display:grid;gap:10px;grid-template-columns:1fr 1fr}
form h3{grid-column:1/-1;margin:0;font-size:16px}
label{display:grid;gap:3px;font-size:12px;color:var(--mu)}
label.w,.w{grid-column:1/-1}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:52px}
.met{grid-column:1/-1;border-top:1px solid var(--ln);padding-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.met h4{grid-column:1/-1;margin:0;font-size:13px}
.calc{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.calc span{background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:3px 8px}
.act{grid-column:1/-1;display:flex;gap:8px;justify-content:space-between}
.empty{color:var(--mu);font-size:13px}
@media (max-width:640px){.day{min-height:78px;padding:3px}.chip{font-size:10.5px;padding:1px 4px}.nav b{min-width:110px}form{grid-template-columns:1fr}.met{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Content Calendar</h1>
  <div class="nav">
    <button class="btn" id="prev" aria-label="Bulan sebelumnya">‹</button>
    <b id="ttl"></b>
    <button class="btn" id="next" aria-label="Bulan berikutnya">›</button>
    <button class="btn" id="tod">Hari ini</button>
  </div>
  <button class="btn pri" id="add">+ Konten</button>
</header>
<div class="bar" id="flt"></div>
<div class="cal">
  <div class="dow" id="dow"></div>
  <div class="grid" id="grid"></div>
</div>
<section class="un"><h2>Belum dijadwalkan</h2><div id="un"></div></section>
</div>

<dialog id="dlg"><form id="frm" method="dialog">
  <h3 id="dh">Konten</h3>
  <label class="w">Judul konten<input id="title" required></label>
  <label>Tanggal<input type="date" id="date"></label>
  <label>Progress<select id="prog"></select></label>
  <label>Format<select id="fmt"></select></label>
  <label>Pillar<select id="pil"></select></label>
  <label>Sosmed<select id="plat"></select></label>
  <label>Jam posting<input type="time" id="time"></label>
  <label class="w">Link brief<input id="brief" placeholder="https://docs.google.com/..."></label>
  <label class="w">Link upload / postingan<input id="link" placeholder="https://..."></label>
  <label class="w">Notes / review<textarea id="notes"></textarea></label>
  <div class="met">
    <h4>Performa</h4>
    <label>Reach<input type="number" min="0" id="reach"></label>
    <label>Impression<input type="number" min="0" id="imp"></label>
    <label>Like<input type="number" min="0" id="like"></label>
    <label>Comment<input type="number" min="0" id="com"></label>
    <label>Share<input type="number" min="0" id="shr"></label>
    <label>Save<input type="number" min="0" id="sav"></label>
    <div class="calc" id="calc"></div>
  </div>
  <div class="act">
    <button type="button" class="btn" id="del">Hapus</button>
    <span><button type="button" class="btn" id="cls">Batal</button> <button class="btn pri" id="sv" value="x">Simpan</button></span>
  </div>
</form></dialog>

<script>
var PROG=["Brief Idea","Desain/Editing","Review","ACC","Posted"],FMT=["Reels/Video","Single Post","Carousel","Story"],PIL=["Edukasi","Hiburan","Promosi"],PLAT=["Instagram","TikTok","Threads"];
var KEY="cc-v1";
var seed=[
{id:1,date:"2026-09-30",format:"Reels/Video",pillar:"Edukasi",platform:"Instagram",title:"Ankle Sprain “Sudah Nggak Bengkak, Tapi Masih Belum Normal?”",brief:"https://docs.google.com/document/d/1C_Cv04664WnRNA6TIdX311eOKV6x8h_TmhUgj9r_Y_A/edit?usp=sharing",prog:"Brief Idea"},
{id:2,date:"2026-09-30",format:"Single Post",pillar:"Edukasi",platform:"Instagram",title:"ESWT Bisa Buat Cedera Apa Aja?",brief:"https://docs.google.com/document/d/19ScU1CQRDB5iQy8ut_FY08z5lSTexBBO0GXFqbAbQ58/edit?usp=sharing",prog:"Brief Idea"},
{id:3,date:"2026-09-30",format:"Reels/Video",pillar:"Hiburan",platform:"Instagram",title:"Ketika pasien minta sembuh hari ini",brief:"https://docs.google.com/document/d/1XRifuzhYOHhpaT5Hkp1kiIWWn6iyh3gS7FqIF33r0OQ/edit?usp=sharing",prog:"Brief Idea"},
{id:4,date:"2026-09-30",format:"Reels/Video",pillar:"Promosi",platform:"Instagram",title:"Ekspetasi vs Realita datang ke fisioterapi",brief:"https://docs.google.com/document/d/1ElX-A5dgEBUbw_S02wa56hrHDaJyqg_SHTi_psYoM8E/edit?usp=sharing",prog:"Brief Idea"},
{id:5,date:"2026-09-30",format:"Reels/Video",pillar:"Hiburan",platform:"Instagram",title:"Blind ranking 5 treatment untuk runner",brief:"https://docs.google.com/document/d/1LQ1wLbQ9ts5RKbjUdGD9haIC2Tu7TraZCnLt7s9m4ss/edit?usp=sharing",prog:"Brief Idea"},
{id:6,date:"",format:"",pillar:"",platform:"Threads",title:"Konten Minggu ke-1 (tanpa judul)",link:"https://www.threads.com/share/GUA1YIDKZ/",prog:"ACC",notes:"Minggu ke-1",m:{reach:15000,imp:24000,like:900,com:50,shr:50,sav:100}},
{id:7,date:"",format:"",pillar:"",platform:"Instagram",title:"Konten Minggu ke-1 (tanpa judul)",link:"https://www.instagram.com/p/DcNJm2sif_v/",prog:"ACC",notes:"Minggu ke-1"},
{id:8,date:"",format:"Reels/Video",pillar:"",platform:"Instagram",title:"Konten Minggu ke-3 (tanpa judul)",link:"https://www.instagram.com/reel/DdJA94ERLbM/",prog:"ACC",notes:"Minggu ke-3"}
];
var items,cur=new Date(2026,8,1),flt={},editing=null;
try{items=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!items)items=seed;
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var MON=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var DOW=["Sen","Sel","Rab","Kam","Jum","Sab","Min"];
$("dow").innerHTML=DOW.map(function(d){return"<div>"+d+"</div>"}).join("");
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function opts(el,a,blank){el.innerHTML=(blank?'<option value=""></option>':"")+a.map(function(x){return"<option>"+x+"</option>"}).join("")}
opts($("prog"),PROG);opts($("fmt"),FMT,1);opts($("pil"),PIL,1);opts($("plat"),PLAT);
var col={Edukasi:"var(--edu)",Hiburan:"var(--hib)",Promosi:"var(--pro)"};
function renderFlt(){
  $("flt").innerHTML=PIL.map(function(p){return'<button class="f" aria-pressed="'+!flt[p]+'" data-p="'+p+'"><i style="background:'+col[p]+'"></i>'+p+'</button>'}).join("");
}
$("flt").onclick=function(e){var b=e.target.closest("[data-p]");if(!b)return;flt[b.dataset.p]=!flt[b.dataset.p];renderFlt();render()};
function vis(it){return !it.pillar||!flt[it.pillar]}
function chip(it){return'<button class="chip '+(it.pillar||"x")+'" data-id="'+it.id+'" title="'+esc(it.title)+" · "+esc(it.prog)+'">'+esc(it.title)+"</button>"}
function render(){
  $("ttl").textContent=MON[cur.getMonth()]+" "+cur.getFullYear();
  var first=new Date(cur.getFullYear(),cur.getMonth(),1),off=(first.getDay()+6)%7,start=new Date(first);start.setDate(1-off);
  var h="",td=iso(new Date());
  for(var i=0;i<42;i++){
    var d=new Date(start);d.setDate(start.getDate()+i);var k=iso(d);
    if(i==35&&d.getMonth()!=cur.getMonth())break;
    var its=items.filter(function(x){return x.date===k&&vis(x)});
    h+='<div class="day'+(d.getMonth()!=cur.getMonth()?" out":"")+(k===td?" today":"")+'" data-d="'+k+'"><span class="n">'+d.getDate()+"</span>"+its.slice(0,3).map(chip).join("")+(its.length>3?'<span class="more">+'+(its.length-3)+" lagi</span>":"")+"</div>";
  }
  $("grid").innerHTML=h;
  var un=items.filter(function(x){return !x.date&&vis(x)});
  $("un").innerHTML=un.length?un.map(function(x){return'<div class="row" data-id="'+x.id+'"><span style="flex:1">'+esc(x.title)+"<br><small>"+esc(x.platform||"")+(x.notes?" · "+esc(x.notes):"")+'</small></span><span class="tag '+(x.prog=="ACC"?"ACC":"")+'">'+esc(x.prog)+"</span></div>"}).join(""):'<div class="empty">Semua konten sudah punya tanggal.</div>';
}
$("grid").onclick=function(e){
  var c=e.target.closest(".chip");if(c){open(+c.dataset.id);return}
  var d=e.target.closest(".day");if(d)open(null,d.dataset.d);
};
$("un").onclick=function(e){var r=e.target.closest("[data-id]");if(r)open(+r.dataset.id)};
$("prev").onclick=function(){cur.setMonth(cur.getMonth()-1);render()};
$("next").onclick=function(){cur.setMonth(cur.getMonth()+1);render()};
$("tod").onclick=function(){var n=new Date();cur=new Date(n.getFullYear(),n.getMonth(),1);render()};
$("add").onclick=function(){open(null,iso(new Date()))};
var F={title:"title",date:"date",prog:"prog",fmt:"format",pil:"pillar",plat:"platform",time:"time",brief:"brief",link:"link",notes:"notes"};
var M={reach:"reach",imp:"imp",like:"like",com:"com",shr:"shr",sav:"sav"};
function open(id,date){
  editing=id;var it=id?items.find(function(x){return x.id===id}):{date:date||"",prog:"Brief Idea",platform:"Instagram",format:"",pillar:""};
  $("dh").textContent=id?"Edit konten":"Konten baru";$("del").style.display=id?"":"none";
  for(var k in F)$(k).value=it[F[k]]||"";
  for(var k in M)$(k).value=(it.m&&it.m[M[k]])||"";
  calc();$("dlg").showModal();
}
function num(i){return parseFloat($(i).value)||0}
function calc(){
  var r=num("reach"),im=num("imp"),e=num("like")+num("com")+num("shr")+num("sav"),p=function(a,b){return b?(a/b*100).toFixed(2).replace(".",",")+"%":"–"};
  $("calc").innerHTML="<span>Engagement: "+e+"</span><span>ER by reach: "+p(e,r)+"</span><span>ER by impression: "+p(e,im)+"</span><span>Frequency: "+(r?(im/r).toFixed(2).replace(".",","):"–")+"</span>";
}
document.querySelector(".met").oninput=calc;
$("cls").onclick=function(){$("dlg").close()};
$("del").onclick=function(){if(confirm("Hapus konten ini?")){items=items.filter(function(x){return x.id!==editing});save();render();$("dlg").close()}};
$("frm").onsubmit=function(e){
  e.preventDefault();
  var it=editing?items.find(function(x){return x.id===editing}):{id:Date.now()};
  for(var k in F)it[F[k]]=$(k).value.trim();
  it.m={};for(var k in M)it.m[M[k]]=num(k);
  if(!editing)items.push(it);
  save();render();$("dlg").close();
};
renderFlt();render();
</script>
</body>
</html>
